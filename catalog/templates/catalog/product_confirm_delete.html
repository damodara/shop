{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
	<div class="row">
        <div class="col-7">
	        <form class="row" method="post" enctype="multipart/form-data">
		        <div class="card">
			        <h4 class="my-0 font-weight-normal">Действительно хотите удалить {{ object.name }}?</h4>
			        <div class="card-body">
				        {% csrf_token %}
			        </div>
			        <button type="submit" class="btn btn-primary">
				        Удалить
			        </button>
			        <a class="btn btn-light" href="{% url 'catalog:product-list' %}" role="button">Отменить</a>
		        </div>
	        </form>
        </div>
    </div>
</div>
{% endblock %}
