{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
	<div class="row">
        <div class="col-7">
	        <form class="row" method="post" enctype="multipart/form-data">
		        <div class="card">
			        <div class="card-body">
				        {% csrf_token %}
				        <div class="mb-3">
					        <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
					        {{ form.email }}
				        </div>
				        <div class="mb-3">
					        <label for="{{ form.first_name.id_for_label }}" class="form-label">Имя</label>
					        {{ form.first_name }}
				        </div>
				        <div class="mb-3">
					        <label for="{{ form.last_name.id_for_label }}" class="form-label">Фамилия</label>
					        {{ form.last_name }}
				        </div>
				        <div class="mb-3">
					        <label for="{{ form.phone.id_for_label }}" class="form-label">Телефон</label>
					        {{ form.phone }}
				        </div>
				        <div class="mb-3">
					        <label for="{{ form.country.id_for_label }}" class="form-label">Страна</label>
					        {{ form.country }}
				        </div>
				        <div class="mb-3">
					        <label for="{{ form.avatar.id_for_label }}" class="form-label">Аватар</label>
					        {{ form.avatar }}
					        {% if form.instance.avatar %}
						        <div class="mt-2">
							        <p>Текущий аватар:</p>
							        <img src="{{ form.instance.avatar.url }}" alt="Аватар" style="max-width: 200px; max-height: 200px;">
						        </div>
					        {% endif %}
				        </div>
			        </div>
			        <div class="card-footer">
				        <button type="submit" class="btn btn-primary">
					        Сохранить изменения
				        </button>
				        <a href="{% url 'catalog:product-list' %}" class="btn btn-secondary">Отмена</a>
			        </div>
		        </div>
	        </form>
        </div>
    </div>
</div>
{% endblock %}
